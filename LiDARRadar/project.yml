name: LiDARRadar
options:
  bundleIdPrefix: com.pspringchill
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RadarCore:
    path: Packages/RadarCore
targets:
  LiDARRadar:
    type: application
    platform: iOS
    sources:
      - path: LiDARRadar
    dependencies:
      - package: RadarCore
    info:
      path: LiDARRadar/Info.plist
      properties:
        CFBundleDisplayName: LiDAR Radar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: LiDAR Radar uses the camera and LiDAR scanner to build a live 3D point cloud and track nearby obstacles.
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pspringchill.LiDARRadar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
schemes:
  LiDARRadar:
    build:
      targets:
        LiDARRadar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RadarCore/RadarCoreTests
    archive:
      config: Release
